<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mathoria | Γεωμετρία</title>

    <link rel="stylesheet" href="style.css">
    <script src="progress.js"></script>

    <style>
        .game-container {
            max-width: 700px;
            margin: 70px auto;
            padding: 20px;
            text-align: center;
        }

        .question {
            font-size: 32px;
            margin: 35px 0;
        }

        .shape {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px auto;
            color: #b98cff;
            font-weight: bold;
            border: 3px solid #b98cff;
            background: rgba(185,140,255,0.08);
        }

        .answer {
            width: 220px;
            padding: 15px;
            border: 1px solid rgba(185,140,255,0.4);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 20px;
            text-align: center;
            outline: none;
        }

        .answer:focus {
            border-color: #b98cff;
        }

        .submit-btn,
        .restart-btn {
            margin-top: 20px;
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            background: #b98cff;
            color: #0b0b1a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .submit-btn:hover,
        .restart-btn:hover {
            background: #d0b5ff;
        }

        .question-number {
            color: #aaaabd;
            margin-top: 20px;
        }

        .result {
            min-height: 30px;
            margin-top: 20px;
            color: #b98cff;
            font-size: 18px;
        }

        .score {
            margin-top: 25px;
            color: #aaaabd;
        }

        .restart-btn {
            display: none;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">MATHORIA</a>

        <a href="a-gymnasiou.html" class="back">
            ← Α΄ Γυμνασίου
        </a>
    </nav>

    <main class="game-container">

        <div class="small-title">
            MATHORIA
        </div>

        <h1>Γεωμετρία</h1>

        <div class="question-number" id="questionNumber">
            Ερώτηση 1 από 10
        </div>

        <div class="question" id="question">
            Φόρτωση...
        </div>

        <div class="shape" id="shape"></div>

        <input
            type="number"
            id="answer"
            class="answer"
            placeholder="Απάντηση σε cm²"
        >

        <br>

        <button class="submit-btn" onclick="checkAnswer()">
            Απάντηση
        </button>

        <div class="result" id="result"></div>

        <div class="score">
            Σκορ: <span id="score">0</span> / 100
        </div>

        <button class="restart-btn" id="restart" onclick="restartGame()">
            Ξανά από την αρχή
        </button>

    </main>

    <script>
        let questionNumber = 1;
        let score = 0;
        let correctAnswer = 0;

        function randomNumber(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function createQuestion() {

            const type = randomNumber(1, 2);
            const shape = document.getElementById("shape");

            if (type === 1) {

                const side = randomNumber(2, 12);

                correctAnswer = side * side;

                document.getElementById("question").textContent =
                    "Ποιο είναι το εμβαδόν του τετραγώνου;";

                shape.style.width = "160px";
                shape.style.height = "160px";

                shape.innerHTML = `${side} cm`;
            }

            else {

                const width = randomNumber(3, 12);
                const height = randomNumber(2, 10);

                correctAnswer = width * height;

                document.getElementById("question").textContent =
                    "Ποιο είναι το εμβαδόν του ορθογωνίου;";

                shape.style.width = "220px";
                shape.style.height = "140px";

                shape.innerHTML = `${width} cm × ${height} cm`;
            }

            document.getElementById("questionNumber").textContent =
                `Ερώτηση ${questionNumber} από 10`;

            document.getElementById("answer").value = "";
            document.getElementById("answer").focus();
        }

        function checkAnswer() {

            const answer = Number(
                document.getElementById("answer").value
            );

            const result = document.getElementById("result");

            if (answer === correctAnswer) {

                score += 10;
                addXP(10);

                result.textContent =
                    "Σωστό! +10 πόντοι";

            } else {

                result.textContent =
                    `Λάθος! Η σωστή απάντηση ήταν ${correctAnswer} cm².`;
            }

            document.getElementById("score").textContent = score;

            document.getElementById("answer").disabled = true;
            document.querySelector(".submit-btn").disabled = true;

            setTimeout(() => {

                questionNumber++;

                if (questionNumber <= 10) {

                    document.getElementById("answer").disabled = false;
                    document.querySelector(".submit-btn").disabled = false;

                    result.textContent = "";

                    createQuestion();

                } else {

                    finishGame();

                }

            }, 1200);
        }

        function finishGame() {

            document.getElementById("questionNumber").textContent =
                "Το παιχνίδι ολοκληρώθηκε!";

            document.getElementById("question").textContent =
                `Τελικό σκορ: ${score} / 100`;

            document.getElementById("shape").style.display = "none";
            document.getElementById("answer").style.display = "none";
            document.querySelector(".submit-btn").style.display = "none";

            document.getElementById("result").textContent =
                score === 100
                ? "Τέλειο! Έκανες 10/10!"
                : "Μπράβο! Δοκίμασε ξανά για καλύτερο σκορ.";

            document.getElementById("restart").style.display = "inline-block";
        }

        function restartGame() {

            questionNumber = 1;
            score = 0;

            document.getElementById("score").textContent = score;

            document.getElementById("shape").style.display = "flex";
            document.getElementById("answer").style.display = "inline-block";
            document.querySelector(".submit-btn").style.display = "inline-block";

            document.getElementById("answer").disabled = false;
            document.querySelector(".submit-btn").disabled = false;

            document.getElementById("restart").style.display = "none";
            document.getElementById("result").textContent = "";

            createQuestion();
        }

        createQuestion();
    </script>

</body>
</html>
