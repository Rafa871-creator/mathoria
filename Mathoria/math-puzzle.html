<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mathoria | Math Puzzle</title>

    <link rel="stylesheet" href="style.css">
    <script src="progress.js"></script>

    <style>
        .game-page {
            max-width: 850px;
            margin: 0 auto;
            padding: 60px 20px 90px;
            text-align: center;
        }

        .game-header {
            margin-bottom: 35px;
        }

        .game-header h1 {
            margin-bottom: 10px;
        }

        .game-header p {
            color: #aaaabd;
            font-size: 18px;
        }

        .puzzle-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(185,140,255,0.3);
            border-radius: 22px;
            padding: 40px 30px;
        }

        .progress {
            color: #aaaabd;
            margin-bottom: 25px;
        }

        .progress strong {
            color: #b98cff;
        }

        .question {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .answer {
            padding: 18px;
            border-radius: 14px;
            border: 1px solid rgba(185,140,255,0.3);
            background: rgba(255,255,255,0.04);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            border-color: #b98cff;
            background: rgba(185,140,255,0.1);
            transform: translateY(-2px);
        }

        .answer.correct {
            border-color: #8cffb0;
            background: rgba(100,255,150,0.12);
        }

        .answer.wrong {
            border-color: #ff8c8c;
            background: rgba(255,100,100,0.12);
        }

        .score {
            margin-top: 25px;
            color: #aaaabd;
        }

        .score strong {
            color: #b98cff;
        }

        .result {
            display: none;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(185,140,255,0.3);
            border-radius: 22px;
            padding: 40px 30px;
        }

        .result h2 {
            color: #b98cff;
            margin-bottom: 20px;
        }

        .result p {
            color: #aaaabd;
            font-size: 18px;
            line-height: 1.6;
        }

        .earned-xp {
            font-size: 28px;
            font-weight: bold;
            color: #b98cff;
            margin: 20px 0;
        }

        .game-button {
            display: inline-block;
            margin-top: 10px;
            padding: 14px 30px;
            border: none;
            border-radius: 12px;
            background: #b98cff;
            color: #0b0b1a;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .game-button:hover {
            transform: translateY(-2px);
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #bbb;
            text-decoration: none;
        }

        .back-link:hover {
            color: #b98cff;
        }

        @media (max-width: 600px) {
            .answers {
                grid-template-columns: 1fr;
            }

            .question {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">MATHORIA</a>

        <div>
            <a href="index.html">Αρχική</a>
            <a href="games.html">Παιχνίδια</a>
            <a href="achievements.html">Επιτεύγματα</a>
            <a href="profile.html">Προφίλ</a>
        </div>
    </nav>

    <main class="game-page">

        <section class="game-header">
            <div class="small-title">MATHORIA PUZZLES</div>

            <h1>Math Puzzle</h1>

            <p>
                Λύσε τους μαθηματικούς γρίφους και δες πόσο καλά σκέφτεσαι!
            </p>
        </section>

        <div class="puzzle-box" id="puzzleBox">

            <div class="progress">
                Γρίφος
                <strong>
                    <span id="questionNumber">1</span>
                </strong>
                / 8
            </div>

            <div class="question" id="question">
                2 + 2 × 3 = ?
            </div>

            <div class="answers" id="answers"></div>

            <div class="score">
                Σκορ:
                <strong>
                    <span id="score">0</span>
                </strong>
            </div>

        </div>

        <div class="result" id="result">

            <h2>Ολοκλήρωσες το Puzzle!</h2>

            <p>
                Σωστές απαντήσεις:
                <strong id="finalScore">0</strong>
                / 8
            </p>

            <div class="earned-xp">
                +<span id="earnedXP">0</span> XP
            </div>

            <button
                class="game-button"
                onclick="startGame()"
            >
                Παίξε ξανά
            </button>

        </div>

        <a href="games.html" class="back-link">
            ← Επιστροφή στα παιχνίδια
        </a>

    </main>

    <script>

        const puzzles = [

            {
                question: "2 + 2 × 3 = ?",
                answers: ["8", "12", "10", "6"],
                correct: "8"
            },

            {
                question: "Ένας αριθμός + 15 = 32. Ποιος είναι ο αριθμός;",
                answers: ["17", "18", "16", "47"],
                correct: "17"
            },

            {
                question: "Ποιος αριθμός λείπει; 3, 6, 12, 24, ?",
                answers: ["36", "42", "48", "50"],
                correct: "48"
            },

            {
                question: "Αν 5x = 45, τότε x = ?",
                answers: ["5", "8", "9", "10"],
                correct: "9"
            },

            {
                question: "Ποιο είναι το 25% του 200;",
                answers: ["25", "40", "50", "75"],
                correct: "50"
            },

            {
                question: "Ένα τετράγωνο έχει πλευρά 7 cm. Ποια είναι η περίμετρός του;",
                answers: ["14 cm", "21 cm", "28 cm", "49 cm"],
                correct: "28 cm"
            },

            {
                question: "Ποιος αριθμός είναι μεγαλύτερος;",
                answers: ["3²", "2⁴", "√81", "10"],
                correct: "2⁴"
            },

            {
                question: "Αν x + x = 18, τότε x = ?",
                answers: ["6", "8", "9", "12"],
                correct: "9"
            }

        ];


        let currentQuestion = 0;
        let score = 0;
        let gameFinished = false;


        const questionElement =
            document.getElementById("question");

        const answersElement =
            document.getElementById("answers");

        const questionNumber =
            document.getElementById("questionNumber");

        const scoreElement =
            document.getElementById("score");

        const puzzleBox =
            document.getElementById("puzzleBox");

        const result =
            document.getElementById("result");

        const finalScore =
            document.getElementById("finalScore");

        const earnedXP =
            document.getElementById("earnedXP");


        function startGame() {

            currentQuestion = 0;
            score = 0;
            gameFinished = false;

            scoreElement.textContent = "0";

            puzzleBox.style.display = "block";
            result.style.display = "none";

            showQuestion();
        }


        function showQuestion() {

            const puzzle =
                puzzles[currentQuestion];

            questionNumber.textContent =
                currentQuestion + 1;

            questionElement.textContent =
                puzzle.question;

            answersElement.innerHTML = "";

            puzzle.answers.forEach(function(answer) {

                const button =
                    document.createElement("button");

                button.className = "answer";

                button.textContent = answer;

                button.addEventListener(
                    "click",
                    function() {
                        checkAnswer(button, answer);
                    }
                );

                answersElement.appendChild(button);

            });
        }


        function checkAnswer(button, answer) {

            if (gameFinished) {
                return;
            }

            const puzzle =
                puzzles[currentQuestion];

            const allButtons =
                document.querySelectorAll(".answer");

            allButtons.forEach(function(btn) {
                btn.disabled = true;
            });


            if (answer === puzzle.correct) {

                button.classList.add("correct");

                score += 1;

                scoreElement.textContent =
                    score;

            }
            else {

                button.classList.add("wrong");

                allButtons.forEach(function(btn) {

                    if (
                        btn.textContent ===
                        puzzle.correct
                    ) {
                        btn.classList.add("correct");
                    }

                });

            }


            setTimeout(function() {

                currentQuestion++;

                if (
                    currentQuestion >=
                    puzzles.length
                ) {
                    finishGame();
                }
                else {
                    showQuestion();
                }

            }, 700);

        }


        function finishGame() {

            gameFinished = true;

            /*
             * 10 XP για κάθε σωστή απάντηση.
             */
            const xp =
                score * 10;

            if (xp > 0) {
                addXP(xp);
            }

            finalScore.textContent =
                score;

            earnedXP.textContent =
                xp;

            puzzleBox.style.display =
                "none";

            result.style.display =
                "block";
        }


        startGame();

    </script>

</body>
</html>
