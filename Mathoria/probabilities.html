<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mathoria | Πιθανότητες</title>

    <link rel="stylesheet" href="style.css">
    <script src="progress.js"></script>

    <style>
        .game-container {
            max-width: 850px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        .question-number {
            color: #aaaabd;
            margin: 25px 0;
        }

        .question {
            font-size: 28px;
            margin: 45px 0 30px;
            line-height: 1.5;
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 650px;
            margin: 30px auto;
        }

        .answer {
            padding: 18px;
            border: 1px solid rgba(185,140,255,0.35);
            border-radius: 15px;
            background: rgba(255,255,255,0.04);
            color: white;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        .answer:hover {
            background: rgba(185,140,255,0.12);
            border-color: #b98cff;
            transform: translateY(-3px);
        }

        .answer:disabled {
            cursor: default;
            opacity: 0.7;
        }

        .result {
            min-height: 30px;
            margin-top: 25px;
            color: #b98cff;
            font-size: 18px;
        }

        .score {
            margin-top: 20px;
            color: #aaaabd;
        }

        .restart {
            display: none;
            padding: 14px 28px;
            border: none;
            border-radius: 10px;
            background: #b98cff;
            color: #0b0b1a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .restart:hover {
            background: #d0b5ff;
        }

        .probability {
            color: #b98cff;
            font-size: 34px;
            margin: 25px 0;
        }

        @media (max-width: 600px) {
            .answers {
                grid-template-columns: 1fr;
            }

            .question {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html" class="logo">MATHORIA</a>

        <a href="g-gymnasiou.html" class="back">
            ← Γ΄ Γυμνασίου
        </a>
    </nav>

    <main class="game-container">

        <div class="small-title">
            MATHORIA
        </div>

        <h1>Πιθανότητες</h1>

        <div class="question-number" id="questionNumber">
            Ερώτηση 1 από 10
        </div>

        <div class="question" id="question">
            Φόρτωση...
        </div>

        <div class="probability" id="probability">
        </div>

        <div class="answers" id="answers"></div>

        <div class="result" id="result"></div>

        <div class="score">
            Σκορ: <span id="score">0</span> / 100
        </div>

        <button
            class="restart"
            id="restart"
            onclick="restartGame()"
        >
            Ξανά από την αρχή
        </button>

    </main>

    <script>

        const questions = [
            {
                question: "Ρίχνεις ένα κανονικό ζάρι. Ποια είναι η πιθανότητα να φέρεις 6;",
                answers: ["1/2", "1/3", "1/6", "1/12"],
                correct: "1/6"
            },

            {
                question: "Ρίχνεις ένα κανονικό ζάρι. Ποια είναι η πιθανότητα να φέρεις ζυγό αριθμό;",
                answers: ["1/6", "1/3", "1/2", "2/3"],
                correct: "1/2"
            },

            {
                question: "Ρίχνεις ένα νόμισμα. Ποια είναι η πιθανότητα να φέρεις Κεφαλή;",
                answers: ["0", "1/4", "1/2", "1"],
                correct: "1/2"
            },

            {
                question: "Σε μια σακούλα υπάρχουν 3 κόκκινες και 2 μπλε μπάλες. Ποια είναι η πιθανότητα να πάρεις μπλε;",
                answers: ["1/5", "2/5", "3/5", "4/5"],
                correct: "2/5"
            },

            {
                question: "Ρίχνεις ένα κανονικό ζάρι. Ποια είναι η πιθανότητα να φέρεις αριθμό μεγαλύτερο από 4;",
                answers: ["1/6", "1/3", "1/2", "2/3"],
                correct: "1/3"
            },

            {
                question: "Ρίχνεις ένα κανονικό ζάρι. Ποια είναι η πιθανότητα να φέρεις αριθμό μικρότερο από 3;",
                answers: ["1/6", "1/3", "1/2", "2/3"],
                correct: "1/3"
            },

            {
                question: "Σε μια τράπουλα υπάρχουν 4 άσοι σε 52 φύλλα. Ποια είναι η πιθανότητα να τραβήξεις άσο;",
                answers: ["1/13", "1/12", "1/10", "1/4"],
                correct: "1/13"
            },

            {
                question: "Μια σακούλα έχει 5 πράσινες και 5 κίτρινες μπάλες. Ποια είναι η πιθανότητα να πάρεις πράσινη;",
                answers: ["1/5", "1/3", "1/2", "2/3"],
                correct: "1/2"
            },

            {
                question: "Ρίχνεις ένα κανονικό ζάρι. Ποια είναι η πιθανότητα να φέρεις αριθμό μικρότερο ή ίσο με 6;",
                answers: ["0", "1/6", "1/2", "1"],
                correct: "1"
            },

            {
                question: "Ρίχνεις ένα νόμισμα δύο φορές. Ποια είναι η πιθανότητα να φέρεις δύο Κεφαλές;",
                answers: ["1/2", "1/3", "1/4", "1/8"],
                correct: "1/4"
            }
        ];

        let currentQuestion = 0;
        let score = 0;

        function showQuestion() {

            const q = questions[currentQuestion];

            document.getElementById("questionNumber").textContent =
                `Ερώτηση ${currentQuestion + 1} από 10`;

            document.getElementById("question").textContent =
                q.question;

            document.getElementById("probability").textContent = "";

            document.getElementById("result").textContent = "";

            const answersDiv =
                document.getElementById("answers");

            answersDiv.innerHTML = "";

            q.answers.forEach(answer => {

                const button =
                    document.createElement("button");

                button.className = "answer";
                button.textContent = answer;

                button.onclick = function() {
                    checkAnswer(answer);
                };

                answersDiv.appendChild(button);
            });
        }

        function checkAnswer(answer) {

            const q = questions[currentQuestion];

            document.querySelectorAll(".answer").forEach(button => {
                button.disabled = true;
            });

            if (answer === q.correct) {

                score += 10;
                addXP(10);

                document.getElementById("result").textContent =
                    "Σωστό! +10 πόντοι";

            } else {

                document.getElementById("result").textContent =
                    `Λάθος! Η σωστή απάντηση ήταν ${q.correct}.`;
            }

            document.getElementById("score").textContent =
                score;

            setTimeout(() => {

                currentQuestion++;

                if (currentQuestion < questions.length) {

                    showQuestion();

                } else {

                    finishGame();

                }

            }, 1200);
        }

        function finishGame() {

            document.getElementById("questionNumber").textContent =
                "Οι Πιθανότητες ολοκληρώθηκαν!";

            document.getElementById("question").textContent =
                `Τελικό σκορ: ${score} / 100`;

            document.getElementById("probability").textContent = "";

            document.getElementById("answers").innerHTML = "";

            document.getElementById("result").textContent =
                score === 100
                ? "Τέλειο! Έκανες 10/10!"
                : "Μπράβο! Δοκίμασε ξανά για καλύτερο σκορ.";

            document.getElementById("restart").style.display =
                "inline-block";
        }

        function restartGame() {

            currentQuestion = 0;
            score = 0;

            document.getElementById("score").textContent =
                score;

            document.getElementById("restart").style.display =
                "none";

            showQuestion();
        }

        showQuestion();

    </script>

</body>
</html>
